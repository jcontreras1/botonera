			<button data-file="francia" class="h-100 btn btn-outline-primary reproducir col-6 col-md-3 col-lg-1 mb-1">francia</button>
			<button data-file="italiaSlow" class="h-100 btn btn-outline-primary reproducir col-6 col-md-3 col-lg-1 mb-1">italiaSlow</button>

			<button data-file="brasileroALosBifes" class="h-100 btn btn-outline-primary reproducir col-6 col-md-3 col-lg-1 mb-1">brasilDRT</button>

			<button data-file="rusia" class="h-100 btn btn-outline-primary reproducir col-6 col-md-3 col-lg-1 mb-1">Himno Rusia</button>
		</div>

		<script>
			const stop = document.getElementById('stop');
			const overlapToggle = document.getElementById('overlapToggle');
			const audios = document.querySelectorAll('.reproducir');
			const activeAudios = new Set();
			const activeButtons = new Map();

			const markButtonAsPlaying = (button) => {
				const activeCount = (activeButtons.get(button) || 0) + 1;
				activeButtons.set(button, activeCount);
				button.classList.add('is-playing');
			};

			const unmarkButtonAsPlaying = (button) => {
				const activeCount = (activeButtons.get(button) || 0) - 1;

				if (activeCount <= 0) {
					activeButtons.delete(button);
					button.classList.remove('is-playing');
					return;
				}

				activeButtons.set(button, activeCount);
			};

			const stopAudio = () => {
				for (const audio of activeAudios) {
					audio.pause();
					audio.currentTime = 0;
				}

				activeAudios.clear();
				activeButtons.clear();
				audios.forEach((button) => button.classList.remove('is-playing'));
			};

			const playTrack = (trackName, button) => {
				if (!overlapToggle.checked) {
					stopAudio();
				}

				const audio = new Audio(`audioFiles/${trackName}.mp3`);
				activeAudios.add(audio);
				markButtonAsPlaying(button);

				const cleanup = () => {
					activeAudios.delete(audio);
					unmarkButtonAsPlaying(button);
				};

				audio.addEventListener('ended', cleanup, { once: true });
				audio.addEventListener('error', cleanup, { once: true });

				audio.play().catch(() => {
					cleanup();
				});
			};

			document.addEventListener('keydown', (event) => {
				if (event.code === 'Space') {
					event.preventDefault();
					stopAudio();
					return;
				}

				if (event.code === 'F7') {
					event.preventDefault();
					overlapToggle.checked = !overlapToggle.checked;
				}
			});

			for (const button of audios) {
				button.addEventListener('click', (event) => {
					event.preventDefault();
					playTrack(event.currentTarget.dataset.file, event.currentTarget);
				});
			}

			stop.addEventListener('click', stopAudio);
		</script>
		</div>
